name: Rust

on:
    push:
    pull_request:

jobs:
    rust:
        uses: FyraLabs/actions/.github/workflows/rust.yml@main
        with:
            test-container: '{"image": "ghcr.io/terrapkg/builder:f44"}'
            test-pre: dnf install -y 'pkgconfig(fontconfig)' 'pkgconfig(libacl)' 'pkgconfig(glib-2.0)' 'pkgconfig(gnome-desktop-4)' 'pkgconfig(openssl)' clang-devel gcc cmake cryptsetup
            clippy-pre: dnf install -y 'pkgconfig(fontconfig)' 'pkgconfig(libacl)' 'pkgconfig(glib-2.0)' 'pkgconfig(gnome-desktop-4)' 'pkgconfig(openssl)' clang-devel gcc cmake cryptsetup
