name: End to End Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/terrapkg/builder:f45
      options: --privileged -v /dev:/dev -v /usr:/hostusr -v /:/hostfs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Clean up space
        run: |
          df -h
          # Wipe stuff in our host /usr to make some space

          # We don't need the android SDK
          rm -rf /hostusr/local/lib/android
          # We're a Rust shop, not a Haskell shop
          rm -rf /hostusr/local/.ghcup
          rm -rf /hostfs/opt/ghc
          # We don't even use .NET
          rm -rf /hostusr/share/dotnet
          # We don't need CodeQL in this action
          rm -rf /hostfs/opt/hostedtoolcache/CodeQL

          echo "After cleanup:"
          df -h

      - name: Install dependencies
        run: |
          dnf install -y isotovideo edk2-ovmf qemu systemd-repart dosfstools e2fsprogs btrfs-progs
          dnf builddep -y ci/readymade.spec

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: e2e-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            e2e-cargo-

      # built here rather than only in test.sh so the cache gets saved even if the e2e test fails
      - name: Build readymade-playbook
        run: cargo build -p readymade-playbook --bin readymade-playbook --release

      - name: Save Cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Run tests
        run: cd test && ./test.sh
