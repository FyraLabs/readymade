[Partition]
# Root stays on the top-level subvolume. /home and /var are separate subvolumes so snapper's
# root snapshots (and `snapper undochange`) never include app data or user files.
MountPoint=/:subvol=/,compress=zstd:1
MountPoint=/home:subvol=/home,compress=zstd:1
MountPoint=/var:subvol=/var,compress=zstd:1
DefaultSubvolume=/
Type=root
#Compression=zstd
Format=btrfs
# Subvolumes= only applies to directories repart creates itself
MakeDirectories=/home /var
Subvolumes=/ /home /var
#CompressionLevel=1
