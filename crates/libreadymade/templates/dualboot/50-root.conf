# Readymade sets SizeMinBytes/SizeMaxBytes to what the user picked before running repart
[Partition]
MountPoint=/:subvol=/,compress=zstd:1
MountPoint=/home:subvol=/home,compress=zstd:1
DefaultSubvolume=/
Type=root
#Compression=zstd
ExcludeFiles=/boot/
Format=btrfs
CopyFiles=/:/
Subvolumes=/ /home
#CompressionLevel=1
