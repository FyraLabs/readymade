# Adopts the ESP Windows already uses, see libreadymade's dualboot module.
# There is deliberately no Format= or CopyFiles= here as systemd-repart must never format or write to
# this partition. Readymade pins SizeMinBytes/SizeMaxBytes to its current size before running repart
# so it doesn't get grown either, and copies our EFI binaries in next to EFI/Microsoft itself.
[Partition]
Type=esp
MountPoint=/boot/efi:umask=0077,shortname=winnt
